services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
  migrate:
    build: .
    command: ["node", "db/migrate.js"]
    environment:
      DATABASE_URL: postgres://booking:booking@db:5432/booking
    depends_on:
      db: { condition: service_healthy }
  api:
    build: .
    environment:
      DATABASE_URL: postgres://booking:booking@db:5432/booking
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      email-worker: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  email-worker:
    build: .
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: postgres://booking:booking@db:5432/booking
      POLL_INTERVAL_MS: 2000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_FROM: "Branch Appointments <appointments@example.local>"
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
  web:
    build:
      context: ../capitec-schedule-system-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
